# FMS_V3 基礎設施(infra) — 開發期外部服務,學員第一天就能起來
#
#   db     PostgreSQL 17 + pgvector  (SRS TECH-4 / 2.1.5)
#   minio  S3 相容物件儲存           (本次作業用不到,為將來 ETL/檔案上傳預留)
#
# ★ 這份「不是」你的交付物,是給你用的環境。
#   你自己的 backend / frontend 服務,請在**專案根目錄**另外寫一份
#   docker-compose.yml(規格見 SRS 2.1.9;ACC-7 驗收跑的是那一份)。
#   兩份分開放,才不會改一改把環境跟交付物混在一起。
#
# 三步上手(★在 infra/ 目錄下執行):
#   cd infra
#   cp .env.example .env      # 然後把密碼改掉
#   docker compose up -d
#   docker compose ps         # 兩個都 healthy 才算起好
#
# 停止:docker compose down      (資料保留)
# 清空:docker compose down -v   (★連資料一起刪,想清楚再按)

name: fms-v3-lab

services:
  # ── PostgreSQL 17 + pgvector ──────────────────────────────────
  db:
    image: pgvector/pgvector:0.8.6-pg17
    container_name: fms_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fms}
      POSTGRES_USER: ${POSTGRES_USER:-fms}
      # ★不給預設值:沒設就啟動失敗,強迫你設一個真密碼
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請先 cp .env.example .env 並設定密碼}
      TZ: Asia/Taipei
      PGTZ: Asia/Taipei
    ports:
      # 開發期需要:後端從「宿主機」跑(bun run --watch),要連得到這個 port。
      # 想讓外部連不到就改成 "127.0.0.1:5432:5432"(只綁本機)。
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # 具名 volume:容器重建資料不丟(ACC-7 會驗)
      - pgdata:/var/lib/postgresql/data
      # 建表 SQL 放這裡會在「資料庫第一次建立時」自動執行(之後不再跑)。
      # ★路徑相對於本檔(infra/),往上一層找 backend/
      # 尚未建立 backend/ 之前這行請先註解掉,否則 compose 會報路徑不存在。
      - ../backend/src/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # ★等「PG 真的可接受連線」,不是「容器起來了」——附錄 B 坑 9
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fms} -d ${POSTGRES_DB:-fms}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── MinIO(S3 相容物件儲存;本次作業用不到) ────────────────────
  # 為何先放著:將來要做 CSV 原始檔留存、報表匯出、ETL 中繼檔時直接可用,
  # 且 S3 API 是業界標準——學會這個,換到 AWS S3 是同一套 SDK。
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: fms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-fmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?請在 .env 設定 MinIO 密碼(至少 8 碼)}
      TZ: Asia/Taipei
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # 網頁管理介面
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
